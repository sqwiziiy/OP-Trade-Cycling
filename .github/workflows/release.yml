name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MINECRAFT_VERSION: '1.20.1'
  MODRINTH_SLUG: op-trade-cycling

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          TAG="v${VERSION}+mc${MINECRAFT_VERSION}"
          JAR="build/libs/op-trade-cycling-${VERSION}.jar"

          test -n "$VERSION"
          test -f "$JAR"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Check GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.github_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          JAR: ${{ steps.meta.outputs.jar }}
        shell: bash
        run: |
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "OP Trade Cycling ${VERSION} — Minecraft ${MINECRAFT_VERSION}" \
            --notes-file CHANGELOG.md

      - name: Check Modrinth project/version
        id: modrinth
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=MODRINTH_TOKEN secret is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/${MODRINTH_SLUG}")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=Modrinth project '${MODRINTH_SLUG}' does not exist yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_ID="$(jq -r '.id' /tmp/project.json)"
          VERSION="${{ steps.meta.outputs.version }}"

          if curl -fsSL \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/${PROJECT_ID}/version?include_changelog=false" \
            | jq -e --arg version "$VERSION" '.[] | select(.version_number == $version)' >/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=Modrinth version ${VERSION} already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"

      - name: Modrinth status
        if: steps.modrinth.outputs.ready != 'true'
        run: echo "Modrinth publish skipped — ${{ steps.modrinth.outputs.reason }}"

      - name: Publish to Modrinth
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project_id }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: ${{ steps.meta.outputs.jar }}
          name: OP Trade Cycling ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
          java: 17
          fail-mode: fail
